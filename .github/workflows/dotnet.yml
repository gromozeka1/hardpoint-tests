name: BDD Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Weekly canary: build and test against the newest published HardPoint.Testing prerelease
  # instead of the pinned version, so a framework release that breaks the suite surfaces here
  # rather than when someone gets round to bumping the pin. A red run means: bump the pin in
  # Directory.Packages.props and fix whatever the new release changed.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A superseded pull-request push does not need to keep a runner busy, but main and scheduled
# runs do: their history is the signal, so they are never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONFIGURATION: Release
  OUTPUT_DIR: artifacts/tests

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - name: Use the newest published framework (scheduled runs only)
      if: github.event_name == 'schedule'
      shell: bash
      run: |
        set -o pipefail
        # nuget.org lists versions in ascending SemVer order, so the last entry is the newest,
        # prereleases included.
        version=$(curl -fsSL https://api.nuget.org/v3-flatcontainer/hardpoint.testing/index.json \
          | grep -o '"[0-9][^"]*"' | tr -d '"' | tail -1)
        test -n "$version"
        echo "HardPointTestingVersion=$version" >> "$GITHUB_ENV"
        echo "Framework canary: HardPoint.Testing $version" >> "$GITHUB_STEP_SUMMARY"
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          **/*.csproj
          Directory.Packages.props
          global.json
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
        restore-keys: playwright-${{ runner.os }}-
    - name: Restore dependencies
      run: dotnet restore TestAutomation.slnx
    - name: Build
      run: dotnet build Tests/Tests.csproj --no-restore -c "$CONFIGURATION" -o "$OUTPUT_DIR"
    - name: Install Playwright browsers
      run: pwsh "$OUTPUT_DIR/playwright.ps1" install --with-deps chromium
    - name: Start application
      run: docker compose up -d --pull always --wait --wait-timeout 180
    - name: Wait for application
      run: |
        curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:5168/ > /dev/null
        curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:5044/api/products > /dev/null
    - name: Test
      env:
        TEST_Headless: "true"
      run: |
        set -o pipefail
        dotnet test "$OUTPUT_DIR/Tests.dll" --verbosity normal | tee test-run.log
        total=$(grep -E '^\s*Total tests:' test-run.log | awk '{print $3}')
        passed=$(grep -E '^\s*Passed:' test-run.log | awk '{print $2}')
        failed=$(grep -E '^\s*Failed:' test-run.log | awk '{print $2}')
        skipped=$(grep -E '^\s*Skipped:' test-run.log | awk '{print $2}')
        [ -z "$total" ] && total=0
        [ -z "$passed" ] && passed=0
        [ -z "$failed" ] && failed=0
        [ -z "$skipped" ] && skipped=0

        echo "BDD suite: $total tests, $passed passed, $failed failed, $skipped skipped" >> "$GITHUB_STEP_SUMMARY"
        printf '| Result | Count |\n| --- | --- |\n| Total | %s |\n| Passed | %s |\n| Failed | %s |\n| Skipped | %s |\n' "$total" "$passed" "$failed" "$skipped" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: |
          ${{ env.OUTPUT_DIR }}/TestReports.html
          ${{ env.OUTPUT_DIR }}/screenshots/**
        if-no-files-found: ignore
    - name: Upload failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-failure-artifacts
        path: |
          ${{ env.OUTPUT_DIR }}/TestReports.html
          ${{ env.OUTPUT_DIR }}/*.har
          ${{ env.OUTPUT_DIR }}/traces/**
          ${{ env.OUTPUT_DIR }}/screenshots/**
        if-no-files-found: ignore
    - name: Stop application
      if: always()
      run: docker compose down
